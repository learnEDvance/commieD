<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bullet Press — commieD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="factory">
      <header class="stats">
        <span class="stat">LAST <strong id="multiplier">—</strong></span>
        <span class="stat">MAGAZINES <strong id="magazines">0</strong></span>
        <span class="stat">BROKEN <strong id="broken">0</strong></span>
        <span class="stat">TIME <strong id="elapsed">—</strong></span>
      </header>

      <section class="presenter" aria-label="Sequence to type">
        <p class="section-label">SEQUENCE</p>
        <div id="code-row" class="code-row"></div>
        <p id="code-status" class="code-status"></p>
      </section>

      <section class="line" aria-label="Magazine assembly line">
        <div id="magazine-track" class="magazine-track"></div>
      </section>

      <section id="feeds" class="feeds" aria-label="Bullet feeds"></section>
    </main>

    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
