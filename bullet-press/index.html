<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bullet Press — commieD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="press">
      <header class="stats">
        <span class="stat">MULTIPLIER <strong id="multiplier">1.0x</strong></span>
        <span class="stat">MAGAZINES <strong id="magazines">0.0</strong></span>
        <span class="stat">BROKEN <strong id="broken">0</strong></span>
      </header>

      <section class="code" aria-label="Code to type">
        <div id="code-row" class="code-row"></div>
        <p id="code-status" class="code-status">Type the highlighted character</p>
      </section>

      <section class="workspace">
        <div id="magazine" class="magazine" aria-label="Current magazine">
          <div id="magazine-slots" class="magazine__slots"></div>
          <span id="magazine-label" class="magazine__label">MAGAZINE</span>
        </div>

        <div id="input-row" class="input-row" aria-label="Typed sequence"></div>
      </section>

      <p class="hint">
        Correct keys load the magazine. A wrong key breaks it; the broken magazine stays until
        it fills or the sequence ends.
      </p>
    </main>

    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
