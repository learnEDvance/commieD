<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash Supplement Factory — commieD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="factory" id="factory">
      <section class="floor" id="floor" aria-label="Factory floor">
        <div class="floor__canvas" id="floor-canvas">
          <div class="floor__grid" aria-hidden="true"></div>
          <svg class="arrows" id="arrows" aria-hidden="true"></svg>

          <section class="intake" id="intake" aria-label="Empty pot intake">
            <div class="intake__machine">
              <span class="intake__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 4h16l-3 6H7L4 4Z" />
                  <path d="M7 10v8h10v-8" />
                  <path d="M9 18v3h6v-3" />
                </svg>
              </span>
              <div class="intake__titles">
                <span class="intake__eyebrow">COLLECTED TOP LEFT</span>
                <h2 class="intake__title">EMPTY POTS</h2>
              </div>
              <span class="intake__lamp" aria-hidden="true"></span>
            </div>
            <div class="intake__rack is-empty" id="intake-rack"></div>
            <button class="take-pot" id="take-pot" type="button">
              <span>TAKE POT</span>
              <strong id="empties-count">0</strong>
            </button>
          </section>

          <div class="stations-layer" id="stations"></div>

          <aside class="infopanel" id="infopanel" aria-label="Factory information">
            <header class="infopanel__head">
              <span class="infopanel__lamp" id="hud-lamp" aria-hidden="true"></span>
              <div>
                <h1 class="infopanel__title">DASH SUPPLEMENT FACTORY</h1>
                <p class="infopanel__sub">commieD · GHOST SHIFT · FACTORY FLOOR</p>
              </div>
            </header>

            <div class="infopanel__stats">
              <span class="stat">IN PLAY <strong id="active-stat">0</strong></span>
              <span class="stat">VIALS <strong id="vials-stat">0</strong></span>
              <span class="stat">DASH <strong id="dash-stat">0s</strong></span>
              <span class="stat stat--danger">SPOILED <strong id="spoiled-stat">0</strong></span>
            </div>

            <div class="infopanel__plan-head">
              <span>PROCESS PLAN</span>
              <span>01 → 12</span>
            </div>
            <div class="infopanel__plan" id="plan"></div>

            <p class="hint" id="hint" aria-live="polite">
              Take empty pots, then drag them into the grain mill.
            </p>
          </aside>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
