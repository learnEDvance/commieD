<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash Supplement Factory — commieD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="factory" id="factory">
      <header class="hud">
        <div class="hud__brand">
          <span id="hud-lamp" class="hud__lamp"></span>
          <div>
            <h1 class="hud__title">DASH SUPPLEMENT FACTORY</h1>
            <p class="hud__sub">commieD · LINE 01 · GHOST SHIFT</p>
          </div>
        </div>
        <div class="hud__stats">
          <span class="stat">BATCH <strong id="batch-no">—</strong></span>
          <span class="stat">POTS <strong id="pots-stat">0 / 5</strong></span>
          <span class="stat">BOTTLES <strong id="batch-stat">0</strong></span>
          <span class="stat">DASH <strong id="dash-stat">0s</strong></span>
        </div>
      </header>

      <section class="line" id="line" aria-label="Production line">
        <div class="line__scroll" id="line-scroll">
          <div class="line__belt" aria-hidden="true"></div>
          <div class="stations" id="stations"></div>
          <div class="tray" id="tray">
            <span class="tray__tag" id="tray-tag">BATCH —</span>
            <div class="tray__slots" id="tray-slots"></div>
          </div>
        </div>
      </section>

      <footer class="deck">
        <p id="hint" class="hint" aria-live="polite">
          Take 1–5 pots onto the belt.
        </p>
      </footer>
    </main>

    <div id="outcome" class="outcome" hidden>
      <div class="outcome__card">
        <h2 id="outcome-title" class="outcome__title">BATCH COMPLETE</h2>
        <p id="outcome-detail" class="outcome__detail"></p>
        <button id="outcome-action" class="outcome__action" type="button">
          NEW BATCH
        </button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
